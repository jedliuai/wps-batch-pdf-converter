name: Bug report / 问题反馈
description: 报告转换失败、兼容性问题或异常行为
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请不要上传含敏感信息或受保护的原始文档。
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true
  - type: input
    id: wps
    attributes:
      label: WPS Office 版本
      placeholder: 可在 WPS 的“关于”中查看
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: 运行方式
      options:
        - GitHub Release EXE
        - Python 源码
        - 自行构建的 EXE
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: 失败文档的扩展名
      placeholder: .doc / .docx / .wps
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 发生了什么
      description: 请说明复现步骤、预期结果和实际结果。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 控制台错误信息
      description: 请先移除文件名、路径或其他敏感信息。
      render: shell
  - type: checkboxes
    id: protected
    attributes:
      label: 文档保护环境
      options:
        - label: 电脑安装或启用了天锐绿盾等文档保护软件
